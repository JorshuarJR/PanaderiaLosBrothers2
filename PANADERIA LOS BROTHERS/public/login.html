<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso Admin | Los Brothers</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo-box">
                🥐
            </div>

            <span class="eyebrow">
                LOS BROTHERS
            </span>

            <h1>
                Panel administrativo
            </h1>

            <p class="subtitle">
                Ingresa tus datos para administrar
                los pedidos de la panadería.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    🔐 Iniciar sesión
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <div class="login-footer">

                <span>
                    🥐 Los Brothers
                </span>

                <strong>
                    NEXORA
                </strong>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
